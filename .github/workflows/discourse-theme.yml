name: Discourse Theme

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  ci:
    uses: discourse/.github/.github/workflows/discourse-theme.yml@v1
    with:
      skip_linting: true
